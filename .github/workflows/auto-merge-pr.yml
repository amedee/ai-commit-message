name: Enable Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      (
        github.repository_owner == github.event.pull_request.user.login ||
        github.event.pull_request.user.login == 'dependabot[bot]'
      ) &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo "${{ github.repository }}" \
            --auto \
            --rebase
